<!-- CONTENIDO -->

<main class="container section">

    <h5>
        Seleccione un platillo
    </h5>


    <!-- PLATILLO -->

    <div class="input-field">

        <select id="platillo">

            <option value=""
                    disabled
                    selected>

                Seleccione un platillo

            </option>

        </select>

        <label>
            Platillo
        </label>

    </div>


    <!-- NOMBRE -->

    <div class="input-field">

        <input id="nombreCliente"
               name="nombreCliente"
               type="text">

        <label for="nombreCliente">
            Nombre del cliente
        </label>

    </div>


    <!-- DIRECCIÓN -->

    <div class="input-field">

        <input id="direccion"
               name="direccion"
               type="text">

        <label for="direccion">
            Dirección
        </label>

    </div>


    <!-- UBICACIÓN -->

    <div class="center">

        <button type="button"
                id="btnUbicacion"
                class="btn waves-effect waves-light">

            <i class="material-icons left">
                location_on
            </i>

            Obtener ubicación

        </button>

    </div>


    <!-- MAPA -->

    <div id="mapa"></div>


    <br>


    <!-- BOTONES -->

    <div class="center">

        <button type="button"
                id="guardarPedido"
                class="btn green waves-effect waves-light">

            <i class="material-icons left">
                save
            </i>

            Guardar

        </button>


        <button type="button"
                id="cancelarPedido"
                class="btn red waves-effect waves-light">

            <i class="material-icons left">
                cancel
            </i>

            Cancelar

        </button>

    </div>

</main>
